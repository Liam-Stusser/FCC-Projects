<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pokedex</title>
  <link rel="stylesheet" href = "JS_Styles5.css">

  </head>

<body>

  <div class="pokedex">
    <div class="left-screen">
      <div class="display" id="pokemon-display">
        
      </div>
    </div>
    <div class="right-controls">
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Enter Pokémon name or ID" required>
        <button id="search-button">Search</button>
      </div>
      <div class="stats-display">
        <p id="pokemon-name">Name: </p>
        <p id="pokemon-id">ID: </p>
        <p id="weight">Weight: </p>
        <p id="height">Height: </p>
        <p id="types">Types: </p>
        <p id="hp">HP: </p>
        <p id="attack">Attack: </p>
        <p id="defense">Defense: </p>
        <p id="special-attack">Special Attack: </p>
        <p id="special-defense">Special Defense: </p>
        <p id="speed">Speed: </p>
      </div>
    </div>
  </div>
  <script src="JS_Script5.js"></script>
</body>

</html>
